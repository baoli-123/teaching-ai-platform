server:
  port: 8080

app:
  jwt:
    secret: "teaching-ai-platform-jwt-secret-key-for-demo-2026"
    access-expiration-ms: 1800000
    refresh-expiration-ms: 604800000
  redis:
    enabled: false

spring:
  application:
    name: teaching-ai-platform
  messages:
    basename: messages
    encoding: UTF-8
  datasource:
    url: jdbc:h2:mem:teachingai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai
  task:
    scheduling:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
